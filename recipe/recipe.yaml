schema_version: 1

context:
  name: gpcam
  version: "8.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gpcam-${{ version }}.tar.gz
  sha256: 98930b609043da977cb3e97dc147b6a2c72cf28d7568528f814f7c52aee225a7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - numpy <2.3.0,>=2.2.6
    - scipy <1.17.0,>=1.16.0
    - dask-core >=2025.5.1,<2025.6.dev0
    - distributed >=2025.5.1,<2025.6.dev0
    - fvgp =4.11.1
    - loguru

tests:
  - python:
      imports:
        - gpcam
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: gpCAM is a code for autonomous data acquisition
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://gpcam.lbl.gov

extra:
  recipe-maintainers:
    - jan-janssen
